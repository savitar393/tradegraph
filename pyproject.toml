[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradegraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rdflib==7.2.1", "pyshacl==0.31.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.12", "openpyxl>=3.1"]
ingest = ["pypdf>=7.0", "beautifulsoup4>=4.12", "lxml>=5.0"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
tradegraph = "tradegraph.cli:main"

[tool.setuptools.package-data]
"tradegraph.api" = ["*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
